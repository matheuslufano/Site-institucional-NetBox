<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Avalie a Netbox</title>

    <style>
      :root {
        --bg: #0b1220;
        --panel: rgba(255, 255, 255, 0.06);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.7);
        --border: rgba(255, 255, 255, 0.14);
        --blue: rgba(91, 155, 255, 0.24);
        --blueBorder: rgba(91, 155, 255, 0.45);
        --shadow: 0 18px 55px rgba(0, 0, 0, 0.5);
        --r: 18px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial;
        color: var(--text);
        background:
          radial-gradient(
            900px 520px at 10% -10%,
            rgba(91, 155, 255, 0.25),
            transparent 60%
          ),
          radial-gradient(
            820px 520px at 95% 10%,
            rgba(0, 255, 209, 0.14),
            transparent 55%
          ),
          var(--bg);
        min-height: 100vh;
        padding: 16px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      .wrap {
        width: min(560px, 100%);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      .header {
        padding: 18px 16px 12px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.06),
          transparent
        );
      }
      h1 {
        margin: 0;
        font-size: 17px;
      }
      .sub {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .controls {
        padding: 12px 16px 10px;
      }
      .search {
        position: relative;
      }
      .search input {
        width: 100%;
        padding: 14px 12px 14px 40px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.22);
        color: var(--text);
        outline: none;
        font-size: 16px;
      }
      .search .icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.75;
      }

      .list {
        padding: 0 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .card {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .city {
        font-weight: 900;
        font-size: 15px;
      }
      .pill {
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.18);
        color: var(--muted);
      }

      .stars {
        display: flex;
        justify-content: center;
        gap: 8px;
      }
      .star {
        font-size: 28px;
      }

      .hint {
        font-size: 13px;
        color: var(--muted);
        text-align: center;
        line-height: 1.4;
      }

      .actions a {
        display: block;
        width: 100%;
        padding: 12px;
        border-radius: 14px;
        border: 1px solid var(--border);
        font-weight: 900;
        text-align: center;
        text-decoration: none;
      }
      .actions a.primary {
        background: var(--blue);
        border-color: var(--blueBorder);
        color: white;
      }
      .actions a.disabled {
        opacity: 0.5;
        pointer-events: none;
        color: gray;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <section class="panel">
        <header class="header">
          <h1>Avalie a Netbox ⭐</h1>
          <p class="sub">Pesquise sua cidade e avalie no Google.</p>
        </header>

        <div class="controls">
          <div class="search">
            <span class="icon">🔎</span>
            <input
              id="q"
              type="search"
              placeholder="Digite sua cidade..."
              autocomplete="off"
            />
          </div>
        </div>

        <div class="list" id="list"></div>
      </section>
    </div>

    <script>
      function reviewUrl(placeId) {
        return `https://search.google.com/local/writereview?placeid=${encodeURIComponent(placeId)}`;
      }

      const stores =[
        { city: "Barrolândia - TO", placeId: "ChIJA1L7lKR9I5MRbVAt1szFxzo" },
        { city: "Bom Jesus do Tocantins - TO", placeId: "ChIJA8OrOHaFJpMRuE4Wzi6tvWI" },
        { city: "Brasilândia do Tocantins - TO", placeId: "ChIJQUUnzmVfJ5MRn08r3WnA3mw" },
        { city: "Colinas do Tocantins - TO", placeId: "ChIJQUUnzmVfJ5MRn08r3WnA3mw" },
        { city: "Colméia - TO", placeId: "ChIJm934FYkzIZMRMu_3aLyMWUc" },
        { city: "Goianorte - TO", placeId: "ChIJlzTfy9U7IZMRdKbXL6FuvMM" },
        { city: "Guaraí - TO", placeId: "ChIJnTtNm4O5JpMRwJ74TEjr2eA" },
        { city: "Gurupi - TO", placeId: "ChIJ_UsS65OVPpMR7YfAEjwZuH0" },
        { city: "Itacajá - TO", placeId: "ChIJScCGGE61J5MR3bq3RrxyRhc" },
        { city: "Lajeado - TO", placeId: "ChIJ8RyrQdxnJJMRxys-RuKW-RE" },
        { city: "Miracema do Tocantins - TO", placeId: "ChIJ8RyrQdxnJJMRxys-RuKW-RE" },
        { city: "Miranorte - TO", placeId: "ChIJgwn9blNxJJMRCbRPKV8hi3Q" },
        { city: "Paraíso do Tocantins - TO", placeId: "ChIJWePgppJPI5MR72hOEa65hMU" },
        { city: "Pedro Afonso - TO", placeId: "ChIJA8OrOHaFJpMRuE4Wzi6tvWI" },
        { city: "Presidente Kennedy - TO", placeId: "ChIJGUllUmwnJ5MRBs3W97itxxQ" },
        { city: "Rio dos Bois - TO", placeId: "ChIJgwn9blNxJJMRCbRPKV8hi3Q" },
        { city: "Santa Maria do Tocantins - TO", placeId: "ChIJA8OrOHaFJpMRuE4Wzi6tvWI" },
        { city: "Tabocão - TO", placeId: "ChIJE26KfYCnJpMR6GRrWn2b1pk" },
        { city: "Tocantínia - TO", placeId: "ChIJ8RyrQdxnJJMR6GRrWn2b1pk" },
        { city: "Tupirama - TO", placeId: "ChIJA8OrOHaFJpMRuE4Wzi6tvWI" },
      ];

      stores.sort((a, b) => a.city.localeCompare(b.city, "pt-BR"));

      const listEl = document.getElementById("list");
      const qEl = document.getElementById("q");

      function normalize(s) {
        return (s || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
      }

      function render(items) {
        listEl.innerHTML = items
          .map((s) => {
            const enabled = !!s.placeId;
            const url = enabled ? reviewUrl(s.placeId) : "#";

            return `
      <div class="card">
        <div class="top">
          <div class="city">${s.city}</div>
          <div class="pill">Avaliar</div>
        </div>

        <div class="stars">⭐ ⭐ ⭐ ⭐ ⭐</div>

        <div class="hint">
          Sua avaliação é muito importante. Se puder, deixe 5 estrelas no Google.
        </div>

        <div class="actions">
          <a class="primary"
             href="${url}"
             target="_blank"
             rel="noopener">
            ⭐ Avaliar no Google
          </a>
        </div>
      </div>
    `;
          })
          .join("");
      }

      qEl.addEventListener("input", () => {
        const term = normalize(qEl.value.trim());
        if (!term) return render(stores);
        render(stores.filter((s) => normalize(s.city).includes(term)));
      });

      render(stores);
    </script>
  </body>
</html>
